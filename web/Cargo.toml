[package]
name = "braken-web"
description = "Yew browser interface for Braken"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "braken-web"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.83"
braken-viz = { path = "../viz" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4"
yew = { version = "0.23.0", features = ["csr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.83"
features = [
  "AddEventListenerOptions",
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "console",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "ErrorEvent",
  "Event",
  "EventTarget",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "Location",
  "MediaQueryList",
  "MediaQueryListEvent",
  "MessageEvent",
  "MouseEvent",
  "Node",
  "Performance",
  "PointerEvent",
  "ResizeObserver",
  "Touch",
  "TouchEvent",
  "TouchList",
  "Url",
  "WheelEvent",
  "Window",
  "Worker",
]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
braken = { path = "../lib", default-features = false }
