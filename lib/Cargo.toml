[package]
name = "braken"
description = "L-system grammar, derivation, and accelerated execution engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

keywords = [
  "fractal",
  "l-systems",
  "lindenmayer",
  "lsystem",
  "lsystems",
]

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a105afd522b73a6712a802e30bd900cd04cc8019", optional = true }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a105afd522b73a6712a802e30bd900cd04cc8019", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a105afd522b73a6712a802e30bd900cd04cc8019", optional = true }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
nom = "8.0.0"
pollster = { version = "0.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1.0"
wgpu = { version = "27.0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11.0"

[features]
default = ["wgpu"]
cuda = ["dep:cuda-core", "dep:cuda-device", "dep:cuda-host"]
wgpu = ["dep:pollster", "dep:wgpu"]

[dev-dependencies]
braken-viz = { path = "../viz" }
