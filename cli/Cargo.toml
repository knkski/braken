[package]
name = "braken-cli"
description = "Command-line renderer for Braken"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "braken"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
braken-viz = { path = "../viz" }
braken = { path = "../lib" }

[features]
default = []
cuda = ["braken/cuda", "braken-viz/cuda"]
