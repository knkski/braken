[package]
name = "braken-viz"
description = "Visualization and export backends for Braken"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
braken = { path = "../lib", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a105afd522b73a6712a802e30bd900cd04cc8019", optional = true }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a105afd522b73a6712a802e30bd900cd04cc8019", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a105afd522b73a6712a802e30bd900cd04cc8019", optional = true }

[features]
default = []
cuda = ["dep:cuda-core", "dep:cuda-device", "dep:cuda-host"]
